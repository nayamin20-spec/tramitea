    // --- MOTOR DE BÚSQUEDA INTELIGENTE CON TOLERANCIA GRAMATICAL ---
    function normalizeText(text) {
      if (!text) return '';
      return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function calculateScore(tramite, rawQuery) {
      const q = normalizeText(rawQuery);
      if (!q) return 1;

      let score = 0;
      const normCommon = normalizeText(tramite.commonName);
      if (normCommon === q) score += 500;
      else if (normCommon.includes(q)) score += 250;

      if (tramite.synonyms) {
        for (const s of tramite.synonyms) {
          const normS = normalizeText(s);
          if (normS === q) { score += 350; break; }
          else if (normS.includes(q) || q.includes(normS)) score += 180;
        }
      }

      const corpus = normalizeText([
        tramite.commonName,
        tramite.officialName,
        tramite.organismo.name,
        tramite.organismo.acronym,
        tramite.description,
        ...(tramite.synonyms || [])
      ].join(' '));

      const tokens = q.split(/\s+/).filter(Boolean);
      let matchedTokens = 0;
      for (const t of tokens) {
        if (corpus.includes(t)) {
          matchedTokens++;
          score += 30;
        }
      }

      if (tokens.length > 1 && (matchedTokens / tokens.length) < 0.5) return 0;
      return score;
    }

      }, [bookmarks]);

      };

      const filteredTramites = useMemo(() => {

        const scored = TRAMITES_DATA.map(t => ({ item: t, score: calculateScore(t, searchQuery) }))
          .filter(({ item, score }) => {
            if (hasQ && score <= 0) return false;
            if (selectedAuth !== 'todas' && !item.supportedAuth.includes(selectedAuth)) return false;
            if (onlyTop10 && !item.isTop10) return false;
            return true;
          });

        else scored.sort((a, b) => (b.item.isTop10 ? 1 : 0) - (a.item.isTop10 ? 1 : 0) || a.item.rank - b.item.rank);

        return scored.map(s => s.item);
      }, [searchQuery, selectedAuth, onlyTop10]);

          {/* HEADER */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-blue-100/80 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <a href="#" className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-blue-900 text-yellow-300 font-black text-xl flex items-center justify-center shadow-sm border border-blue-500/30 ring-2 ring-yellow-400/30">
                    T
                  </div>
                  <div className="flex flex-col">
                    <span className="text-xl sm:text-2xl font-black tracking-tight text-blue-950">
                      Tramit<span className="text-yellow-500">ea</span>
                    </span>
                  </div>
                </a>
                <span className="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold text-blue-900 bg-blue-50 border border-blue-200/80 px-2.5 py-1 rounded-full">
                  <span className="w-1.5 h-1.5 rounded-full bg-yellow-400"></span>
                  <span>Todos tus trámites en un clic</span>
                </span>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsFavoritesOpen(true)}
                  className="px-3.5 py-2 text-xs sm:text-sm font-semibold text-slate-700 hover:text-blue-950 hover:bg-blue-50/80 rounded-xl transition-colors flex items-center gap-1.5 border border-slate-200 hover:border-blue-200"
                >
                  <svg className="w-4 h-4 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                  <span>Guardados</span>
                  {bookmarks.length > 0 && (
                    <span className="ml-1 px-1.5 py-0.2 bg-yellow-400 text-blue-950 text-xs font-black rounded-full">
                      {bookmarks.length}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* MAIN */}
          <main className="flex-1 pb-16">
            {/* HERO SECTION CON BUSCADOR */}
            <section className="pt-10 pb-6 px-4 sm:px-6 bg-gradient-to-b from-blue-50/40 via-white to-slate-50 border-b border-blue-100/60 text-center">
              <div className="max-w-4xl mx-auto">
                <h1 className="text-3xl sm:text-5xl lg:text-6xl font-black text-blue-950 tracking-tight text-balance">
                  ¿Qué trámite necesitas hacer hoy?
                </h1>
                
                {/* Frase pequeña en verde accesible */}
                <p className="mt-2.5 text-xs sm:text-sm font-semibold text-emerald-700 tracking-wide flex items-center justify-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
                  <span>Enlaces oficiales directos 100% gratuitos y verificados.</span>
                </p>

                {/* BUSCADOR */}
                <div className="mt-6 max-w-2xl mx-auto">
                  <div className="relative flex items-center bg-white rounded-2xl shadow-lg shadow-blue-900/5 border-2 border-slate-200 hover:border-blue-300 focus-within:border-blue-600 focus-within:ring-4 focus-within:ring-yellow-400/25 transition-all p-1.5">
                    <svg className="w-6 h-6 text-blue-600 ml-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Busca tu trámite aquí... (ej. coche, DNI, paro)"
                      className="w-full pl-3 pr-10 py-3.5 bg-transparent text-slate-900 text-base sm:text-lg placeholder:text-slate-400 focus:outline-none"
                    />
                    {searchQuery && (
                      <button
                        onClick={() => setSearchQuery('')}
                        className="p-1 text-slate-400 hover:text-slate-600 mr-2"
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  {/* FILTROS RÁPIDOS */}
                  <div className="mt-3.5 flex flex-wrap items-center justify-center gap-2">
                    <button
                      onClick={() => setOnlyTop10(!onlyTop10)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5 border ${
                        onlyTop10 ? 'bg-yellow-400 border-yellow-500 text-blue-950 font-bold shadow-xs' : 'bg-white border-slate-200 text-slate-700 hover:bg-yellow-50/50'
                      }`}
                    >
                      <span>🏆 Top 10 Más Buscados</span>
                    </button>

                    <button
                      onClick={() => setSelectedAuth(selectedAuth === 'sms_sin_certificado' ? 'todas' : 'sms_sin_certificado')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5 border ${
                        selectedAuth === 'sms_sin_certificado' ? 'bg-blue-600 border-blue-700 text-white shadow-xs' : 'bg-white border-slate-200 text-slate-700 hover:bg-blue-50/50'
                      }`}
                    >
                      <span>📱 Solo con móvil (SMS)</span>
                    </button>

                    <button
                      onClick={() => setSelectedAuth(selectedAuth === 'clave_pin' ? 'todas' : 'clave_pin')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5 border ${
                        selectedAuth === 'clave_pin' ? 'bg-blue-800 border-blue-900 text-white shadow-xs' : 'bg-white border-slate-200 text-slate-700 hover:bg-blue-50/50'
                      }`}
                    >
                      <span>🔑 Con Cl@ve</span>
                    </button>

                    <button
                      onClick={() => setSelectedAuth(selectedAuth === 'certificado_dnie' ? 'todas' : 'certificado_dnie')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5 border ${
                        selectedAuth === 'certificado_dnie' ? 'bg-blue-950 border-blue-950 text-white shadow-xs' : 'bg-white border-slate-200 text-slate-700 hover:bg-blue-50/50'
                      }`}
                    >
                      <span>💻 Con Certificado</span>
                    </button>
                  </div>
                </div>
              </div>
            </section>

            {/* SECCIÓN DIRECTA: RESULTADOS */}
            <section className="max-w-6xl mx-auto px-4 sm:px-6 pt-6">
              <div className="flex items-center justify-between mb-5 pb-2.5 border-b border-blue-100/90">
                <div className="flex items-center gap-2.5">
                  <h2 className="text-xl sm:text-2xl font-black tracking-tight text-blue-950">
                    Resultados
                  </h2>
                  <span className="px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-950 text-xs font-black tabular-nums border border-blue-200">
                    {filteredTramites.length}
                  </span>
                </div>

                <div className="text-xs text-slate-500">
                  {searchQuery.trim() ? (
                    <span>Coincidencias para <strong className="text-blue-950">"{searchQuery}"</strong></span>
                  ) : (
                    <span>{onlyTop10 ? 'Mostrando Top 10 más buscados' : 'Todos los trámites disponibles'}</span>
                  )}
                </div>
              </div>

              {filteredTramites.length === 0 ? (
                <div className="bg-white border border-slate-200 rounded-3xl p-12 text-center max-w-md mx-auto my-8 shadow-xs">
                  <h3 className="text-base font-bold text-slate-800">No encontramos trámites con estos filtros</h3>
                  <p className="text-xs text-slate-500 mt-1">Prueba con otra palabra como "coche", "vida laboral" o "paro".</p>
                  <button
                    onClick={() => { setSearchQuery(''); setSelectedAuth('todas'); setOnlyTop10(false); }}
                    className="mt-4 px-4 py-2 bg-blue-950 text-white text-xs font-semibold rounded-xl"
                  >
                    Restablecer búsqueda
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {filteredTramites.map((tramite) => (
                    <div
                      key={tramite.id}
                      onClick={() => setActiveModal(tramite)}
                      className="group bg-white rounded-2xl border border-slate-200/90 hover:border-slate-300 p-5 shadow-xs hover:shadow-md transition-all cursor-pointer flex flex-col justify-between"
                    >
                      <div>
                        <div className="flex items-center justify-between gap-2 mb-3">
                          <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-xl bg-blue-50 text-blue-900 font-bold text-xs flex items-center justify-center">
                              {tramite.organismo.acronym.substring(0, 3)}
                            </div>
                            <div className="text-xs">
                              <span className="font-bold text-slate-800">{tramite.organismo.acronym}</span>
                              <span className="text-slate-400 block text-[11px]">{tramite.estimatedTime}</span>
                            </div>
                          </div>

                          <div className="flex items-center gap-1.5" onClick={(e) => e.stopPropagation()}>
                            {tramite.isTop10 && (
                              <span className="px-2 py-0.5 rounded-md bg-yellow-100 text-blue-950 text-[11px] font-black border border-yellow-300">
                                #{tramite.rank} Top
                              </span>
                            )}
                            <button
                              onClick={() => toggleBookmark(tramite.id)}
                              className={`p-1.5 rounded-lg transition-colors ${
                                bookmarks.includes(tramite.id) ? 'text-yellow-500 bg-yellow-50' : 'text-slate-300 hover:text-blue-900'
                              }`}
                            >
                              ★
                            </button>
                          </div>
                        </div>

                        <h3 className="text-base sm:text-lg font-bold text-slate-900 group-hover:text-blue-800 transition-colors leading-snug">
                          {tramite.commonName}
                        </h3>

                        <p className="text-xs text-slate-400 mt-1 line-clamp-1 italic">
                          {tramite.officialName}
                        </p>

                        <div className="mt-3.5 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-600">
                          <span>Acceso: <strong>{AUTH_LABELS[tramite.fastestAuthMethod] || tramite.fastestAuthMethod}</strong></span>
                        </div>
                      </div>

                      <div className="mt-5 pt-3.5 border-t border-slate-100 flex items-center justify-between gap-2" onClick={(e) => e.stopPropagation()}>
                        <button
                          onClick={() => setActiveModal(tramite)}
                          className="text-xs font-semibold text-slate-500 hover:text-slate-900"
                        >
                          Ver pasos →
                        </button>

                        <a
                          href={tramite.officialDirectUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-bold text-white bg-blue-950 hover:bg-blue-900 rounded-xl transition-all"
                        >
                          <span>Ir a Sede Oficial</span>
                          <span className="text-yellow-400">↗</span>
                        </a>
                      </div>
                    </div>
                  ))}
          </div>
  )}
</section>
</main>
          {/* FOOTER */}
          <footer className="border-t border-slate-200 bg-white py-6 px-4 text-xs text-slate-400 text-center">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <p className="text-slate-600 font-medium">
                <span className="font-extrabold text-blue-950">Tramit<span className="text-yellow-500">ea</span></span> · Todos tus trámites en un clic
              </p>
              <div className="flex items-center gap-4 text-slate-400 text-[11px]">
                <span className="text-blue-900 font-semibold">100% Gratuito</span>
                <span>·</span>
                <span>Sedes electrónicas oficiales de España</span>
              </div>
            </div>
          </footer>

          {/* MODAL DETALLES DEL TRÁMITE */}
          {activeModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[92vh] overflow-hidden shadow-2xl flex flex-col border border-slate-200">
                <div className="px-6 py-5 border-b border-slate-200 flex items-start justify-between bg-slate-50">
                  <div>
                    <span className="text-xs font-bold text-blue-900">{activeModal.organismo.name}</span>
                    <h2 className="text-xl sm:text-2xl font-black text-slate-900 mt-0.5">{activeModal.commonName}</h2>
                    <p className="text-xs text-slate-500 italic">{activeModal.officialName}</p>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="p-1 text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
                </div>

                <div className="px-6 py-5 overflow-y-auto space-y-5 text-sm text-slate-700">
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 p-3 bg-slate-50 rounded-xl text-xs">
                    <div><span className="text-slate-400 block">Coste:</span><strong>{activeModal.cost}</strong></div>
                    <div><span className="text-slate-400 block">Tiempo estimado:</span><strong>{activeModal.estimatedTime}</strong></div>
                    <div><span className="text-slate-400 block">Acceso recomendado:</span><strong>{AUTH_LABELS[activeModal.fastestAuthMethod]}</strong></div>
                  </div>

                  <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-950">
                    <strong>Alerta anti-estafa: </strong>{activeModal.antiScamAdvice}
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">¿Por qué es difícil de encontrar?</h4>
                    <p className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg">{activeModal.whyIsDifficult}</p>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Requisitos previos</h4>
                    <ul className="text-xs space-y-1 list-disc pl-4 text-slate-600">
                      {activeModal.prerequisites.map((p, i) => <li key={i}>{p}</li>)}
                    </ul>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Pasos a seguir</h4>
                    <div className="space-y-2">
                      {activeModal.steps.map(s => (
                        <div key={s.stepNumber} className="border border-slate-200 rounded-xl p-3 text-xs">
                          <strong className="text-slate-900 block mb-1">{s.stepNumber}. {s.title}</strong>
                          <p className="text-slate-600">{s.instruction}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between">
                  <button onClick={() => toggleBookmark(activeModal.id)} className="text-xs font-semibold text-slate-700">
                    {bookmarks.includes(activeModal.id) ? '★ Guardado' : '☆ Guardar'}
                  </button>
                  <a
                    href={activeModal.officialDirectUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-5 py-2 text-xs font-bold text-white bg-blue-950 hover:bg-blue-900 rounded-xl"
                  >
                    Ir a la Sede Oficial Directa ↗
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* DRAWER GUARDADOS */}
          {isFavoritesOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 flex justify-end">
              <div className="w-full max-w-md bg-white h-full shadow-2xl flex flex-col">
                <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                  <h3 className="font-bold text-slate-900 text-sm">Trámites Guardados ({savedList.length})</h3>
                  <button onClick={() => setIsFavoritesOpen(false)} className="text-slate-400 text-lg font-bold">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {savedList.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-8">No tienes trámites guardados todavía.</p>
                  ) : (
                    savedList.map(t => (
                      <div key={t.id} className="p-3 border border-slate-200 rounded-xl flex items-center justify-between">
                        <div>
                          <strong className="text-xs text-slate-900 block">{t.commonName}</strong>
                          <span className="text-[11px] text-slate-400">{t.organismo.acronym}</span>
                        </div>
                        <a href={t.officialDirectUrl} target="_blank" className="text-xs font-bold text-blue-900">Ir ↗</a>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL GUÍA DE BASE DE DATOS */}
          {isDbGuideOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-hidden flex flex-col shadow-2xl">
                <div className="px-6 py-4 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-sm">Arquitectura de Base de Datos & Escalabilidad</h3>
                  <button onClick={() => setIsDbGuideOpen(false)} className="text-slate-400 text-lg">✕</button>
                </div>
                <div className="p-6 overflow-y-auto text-xs space-y-4 text-slate-700">
                  <p><strong>1. PostgreSQL + TSVECTOR:</strong> Utiliza tipos normalizados para organismos, trámites y variantes de CCAA con índices GIN en español para búsquedas en &lt;5ms.</p>
                  <p><strong>2. Edge CDN Caching:</strong> Con <code>s-maxage=3600</code> en Cloudflare, el 99.8% de las peticiones se sirven desde la memoria caché sin tocar la base de datos.</p>
                  <p><strong>3. Monitor de enlaces:</strong> Worker diario con cron que verifica cabeceras HTTP de sedes oficiales para alertar de errores 404.</p>
                </div>
                <div className="p-4 bg-slate-50 border-t border-slate-200 text-right">
                  <button onClick={() => setIsDbGuideOpen(false)} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-semibold">Cerrar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <div style="text-align: center; margin: 20px 0;">
  <a href="mailto:info@tramitea.org">Contacto: info@tramitea.org</a>
</div>
</body>
</html>
