    // --- MOTOR DE BÚSQUEDA INTELIGENTE CON TOLERANCIA GRAMATICAL ---
    function normalizeText(text) {
      if (!text) return '';
      return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function calculateScore(tramite, rawQuery) {
      const q = normalizeText(rawQuery);
      if (!q) return 1;

      let score = 0;
      const normCommon = normalizeText(tramite.commonName);
      if (normCommon === q) score += 500;
      else if (normCommon.includes(q)) score += 250;

      if (tramite.synonyms) {
        for (const s of tramite.synonyms) {
          const normS = normalizeText(s);
          if (normS === q) { score += 350; break; }
          else if (normS.includes(q) || q.includes(normS)) score += 180;
        }
      }

      const corpus = normalizeText([
        tramite.commonName,
        tramite.officialName,
        tramite.organismo.name,
        tramite.organismo.acronym,
        tramite.description,
        ...(tramite.synonyms || [])
      ].join(' '));

      const tokens = q.split(/\s+/).filter(Boolean);
      let matchedTokens = 0;
      for (const t of tokens) {
        if (corpus.includes(t)) {
          matchedTokens++;
          score += 30;
        }
        }
      
      if (tokens.length > 1 && (matchedTokens / tokens.length) < 0.5) return 0;
      return score;
    }

            if (selectedAuth !== 'todas' && !item.supportedAuth.includes(selectedAuth)) return false;
            if (onlyTop10 && !item.isTop10) return false;
            return true;

        else scored.sort((a, b) => (b.item.isTop10 ? 1 : 0) - (a.item.isTop10 ? 1 : 0) || a.item.rank - b.item.rank);

                  <p><strong>1. PostgreSQL + TSVECTOR:</strong> Utiliza tipos normalizados para organismos, trámites y variantes de CCAA con índices GIN en español para búsquedas en &lt;5ms.</p>
                  <p><strong>2. Edge CDN Caching:</strong> Con <code>s-maxage=3600</code> en Cloudflare, el 99.8% de las peticiones se sirven desde la memoria caché sin tocar la base de datos.</p>
                  <p><strong>3. Monitor de enlaces:</strong> Worker diario con cron que verifica cabeceras HTTP de sedes oficiales para alertar de errores 404.</p>
                </div>
                <div className="p-4 bg-slate-50 border-t border-slate-200 text-right">
                  <button onClick={() => setIsDbGuideOpen(false)} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-semibold">Cerrar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
